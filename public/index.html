<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multithreaded C++ HTTP Server</title>
  <style>
    body { max-width: 760px; margin: 4rem auto; padding: 0 1.25rem;
      font: 16px/1.6 system-ui, sans-serif; color: #172033; }
    h1 { line-height: 1.15; } code { background: #eef2ff; padding: .15rem .35rem; }
    a { color: #2457c5; }
    .card { border: 1px solid #dce2ee; border-radius: 12px; padding: 1rem 1.25rem; }
  </style>
</head>
<body>
  <h1>It works! 🚀</h1>
  <p>This page is being served by a multithreaded HTTP server written in C++17.</p>
  <div class="card">
    <strong>Try the endpoints</strong>
    <ul>
      <li><a href="/health">/health</a> — health check</li>
      <li><a href="/hello">/hello</a> — greeting</li>
      <li><a href="/stats">/stats</a> — runtime counters</li>
      <li><a href="/files/example.txt">/files/example.txt</a> — static file</li>
    </ul>
  </div>
</body>
</html>
